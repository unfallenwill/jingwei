[package]
name = "jingwei"
version = "0.1.0"
edition = "2021"
description = "精卫填海 — a minimal coding agent that fills the sea one stone at a time"
license = "MIT"
repository = "https://github.com/unfallenwill/jingwei"

[dependencies]
ureq = { version = "2", default-features = false, features = ["json", "tls", "gzip"] }
serde_json = "1"
# `serde` itself for the MCP module's deserializable config types — the
# binary does not reach into serde directly, but the mcp::config::ServerConfig
# derive needs `serde::Deserialize` in scope to do its work.
serde = { version = "1", features = ["derive"] }
# The coroutine runtime: the agent is an async fn (a suspensible, resumable,
# cancellable computation) and tokio schedules it. `signal` powers Ctrl-C
# interruption; blocking IO (ureq, file tools) rides the blocking pool so
# every await stays a real suspension point. `process` is for spawning MCP
# stdio servers as child processes.
tokio = { version = "1", features = ["rt", "sync", "time", "signal", "macros", "process"] }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
# Argv parsing. derive gives us subcommands + auto --help; default-features
# off skips the terminal styling we never want anyway.
clap = { version = "4", features = ["derive", "std", "error-context"], default-features = false }

# MCP: external servers' tools, offered to the model. The transport layer
# speaks streamable HTTP (reqwest) and stdio (tokio::process); the protocol
# layer rides on JSON-RPC 2.0 framed as newline-delimited JSON over the
# pipes or as POST bodies over HTTP. `default-tls` is rustls; `rustls`
# itself is pinned below to keep RUSTSEC-2026-0285 (TLS 1.3 handshake
# messages crossing encryption-level boundaries) off the dependency floor.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "default-tls"] }
futures-util = "0.3"
rustls = "0.23.45"
# `libc` is used by the stdio transport's `kill_on_drop` on Unix; the field
# exists only on unix, so it lives in a target-specific table.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The HTTP transport tests spin up a `wiremock` server to assert on the
# JSON-RPC framing the client sends and the SSE framing it accepts back.
wiremock = "0.6.5"

# Tiny release binary, good for distributing cross-platform.
[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
